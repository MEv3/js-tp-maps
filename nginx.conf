events {
    worker_connections 1024;
}

http {
    # MIME types essentiels
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /code;
        index index.php index.html;

        # Logs pour debugging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Servir les fichiers statiques
        location / {
            autoindex on;                # <-- active le listing des dossiers
            autoindex_exact_size off;    # facultatif : affiche taille des fichiers en format lisible
            autoindex_localtime on;      # facultatif : affiche date/heure locale
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Traiter les fichiers PHP
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Bloquer l'accès aux fichiers cachés
        location ~ /\. {
            deny all;
        }
    }
}