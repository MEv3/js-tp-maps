version: '3'

services:
  nginx:
    image: nginx:1.22-alpine
    ports:
      - "8090:80"
    volumes:
      - ./code:/code
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php
    networks:
      - app-network
      
  php:
    build: .
    volumes:
      - ./code:/code
    environment:
      XDEBUG_MODE: debug
      # XDEBUG_CLIENT_HOST: optionnel, détecté automatiquement si non défini
    extra_hosts:
      # Nécessaire pour que host.docker.internal fonctionne sur Linux
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
      
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql 
    ports:
      - "3306:3306"
    networks:
      - app-network
      
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - app-network
      
volumes: 
  dbdata:

networks:
  app-network:
    driver: bridge